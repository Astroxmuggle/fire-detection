{% extends "base.html" %}
{% block title %}{{ code }} — Command Center — {{ app_name }}{% endblock %}

{% block content %}
<div class="error-page-card">
    <div class="error-code-badge">{{ code }}</div>
    <h1 class="error-title">Operational Warning</h1>
    <p class="error-message">{{ message }}</p>
    <div class="error-actions">
        <a class="btn primary" href="{{ url_for('web.dashboard') }}">Back to dashboard</a>
        <a class="btn secondary" href="{{ url_for('web.history') }}">Incident history</a>
    </div>
</div>
{% endblock %}
